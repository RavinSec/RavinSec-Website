services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: ravinsec
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payload -d ravinsec" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://payload:payload@postgres:5432/ravinsec
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  app-dev:
    profiles: [ dev ]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://payload:payload@postgres:5432/ravinsec
      WATCHPACK_POLLING: "true"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./next.config.ts
          target: /app/next.config.ts
        - action: sync
          path: ./tailwind.config.ts
          target: /app/tailwind.config.ts
        - action: sync
          path: ./postcss.config.mjs
          target: /app/postcss.config.mjs
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./components.json
          target: /app/components.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

volumes:
  postgres_data:
  media_data:
